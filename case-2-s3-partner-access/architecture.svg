<text x="375.0" y="317.0" font-size="11" font-weight="400" fill="#5F6B7A" text-anchor="middle">SFTP upload</text>
<line x1="332" y1="476.0" x2="418" y2="476.0" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
<text x="375.0" y="467.0" font-size="11" font-weight="400" fill="#5F6B7A" text-anchor="middle">1. get link</text>
<rect x="840" y="112" width="300" height="428" rx="10" fill="#F2F7EC" stroke="#7AA116" stroke-width="1.5"/>
<path d="M840 122 a10 10 0 0 1 10 -10 h280 a10 10 0 0 1 10 10 v20 h-300 z" fill="#7AA116"/>
<text x="990.0" y="132" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">PARTNER INBOUND BUCKET</text>
<rect x="962.0" y="156" width="56" height="56" rx="6" fill="#7AA116"/>
<use href="#amazons3" xlink:href="#amazons3" x="972.08" y="166.08" width="35.84" height="35.84" fill="#FFFFFF"/>
<rect x="862" y="228" width="80" height="24" rx="5" fill="#FFFFFF" stroke="#7AA116"/>
<text x="902" y="245" font-size="12" font-weight="400" fill="#232F3E" text-anchor="middle">partner-a/</text>
<rect x="950" y="228" width="80" height="24" rx="5" fill="#FFFFFF" stroke="#7AA116"/>
<text x="990" y="245" font-size="12" font-weight="400" fill="#232F3E" text-anchor="middle">partner-b/</text>
<rect x="1038" y="228" width="80" height="24" rx="5" fill="#FFFFFF" stroke="#7AA116"/>
<text x="1078" y="245" font-size="12" font-weight="400" fill="#232F3E" text-anchor="middle">partner-c/</text>
<text x="862" y="288" font-size="12" font-weight="700" fill="#232F3E" text-anchor="start">Guardrails for everyone (bucket policy)</text>
<text x="862" y="308" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">Block Public Access · ACLs disabled</text>
<text x="862" y="328" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">HTTPS only · encrypted by default</text>
<text x="862" y="348" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">each partner: write-only, own folder</text>
<text x="862" y="368" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">versioning · lifecycle (e.g. 30 days)</text>
<text x="862" y="408" font-size="12" font-weight="700" fill="#232F3E" text-anchor="start">Monitoring</text>
<text x="862" y="428" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">CloudTrail data events</text>
<text x="862" y="448" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">IAM Access Analyzer</text>
<text x="862" y="468" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">alert on denied requests</text>
<line x1="752" y1="176.0" x2="838" y2="176.0" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
<text x="795.0" y="167.0" font-size="11" font-weight="400" fill="#5F6B7A" text-anchor="middle">PutObject</text>
<line x1="752" y1="326.0" x2="838" y2="326.0" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
<text x="795.0" y="317.0" font-size="11" font-weight="400" fill="#5F6B7A" text-anchor="middle">writes</text>
<path d="M180 540 V568 H990 V542" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
<text x="585" y="588" font-size="11" font-weight="400" fill="#5F6B7A" text-anchor="middle">2. PUT the file straight to S3 with the link (no AWS credentials)</text>
<rect x="1200" y="252" width="190" height="150" rx="10" fill="#E8F4FD" stroke="#017CEE" stroke-width="1.5"/>
<use href="#apacheairflow" xlink:href="#apacheairflow" x="1271" y="266" width="48" height="48" fill="#017CEE"/>
<text x="1295" y="336" font-size="12" font-weight="700" fill="#232F3E" text-anchor="middle">Our pipeline</text>
<text x="1295" y="354" font-size="12" font-weight="400" fill="#232F3E" text-anchor="middle">validate, then load</text>
<text x="1295" y="372" font-size="12" font-weight="400" fill="#232F3E" text-anchor="middle">into the data lake</text>
<line x1="1142" y1="327" x2="1198" y2="327" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
<text x="1170.0" y="318" font-size="11" font-weight="400" fill="#5F6B7A" text-anchor="middle">new file</text>
<rect x="30" y="620" width="1360" height="160" rx="8" fill="#FAFAFA" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="6 4"/>
<text x="50" y="650" font-size="13" font-weight="700" fill="#232F3E" text-anchor="start">STRICTLY ONLY WHAT THEY NEED · applies to every partner</text>
<text x="50" y="690" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">• one identity per partner (role or SFTP user)</text>
<text x="50" y="724" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">• write-only (PutObject) on its own folder</text>
<text x="50" y="758" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">• no List, Get or Delete unless needed</text>
<text x="500" y="690" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">• deny rules in the bucket policy, for everyone</text>
<text x="500" y="724" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">• separate inbound bucket, away from the data lake</text>
<text x="500" y="758" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">• short sessions; external ID for third parties</text>
<text x="950" y="690" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">• audit: CloudTrail data events, Access Analyzer</text>
<text x="950" y="724" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">• offboarding: delete one role or one user</text>
<text x="950" y="758" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">• IAM user + access keys: last resort only</text>

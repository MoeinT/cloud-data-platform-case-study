<rect width="1420" height="800" fill="#FFFFFF"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#232F3E" text-anchor="start">Case 2 · External partners dropping files into S3</text>
<text x="30" y="66" font-size="14" font-weight="400" fill="#5F6B7A" text-anchor="start">No long-lived credentials where avoidable. One identity and one folder per partner. Write-only.</text>
<text x="30" y="98" font-size="11" font-weight="700" fill="#5F6B7A" text-anchor="start">PARTNER</text>
<text x="420" y="98" font-size="11" font-weight="700" fill="#5F6B7A" text-anchor="start">HOW THEY GET ACCESS (OUR ACCOUNT)</text>
<text x="840" y="98" font-size="11" font-weight="700" fill="#5F6B7A" text-anchor="start">OUR AWS ACCOUNT</text>
<rect x="30" y="112" width="300" height="128" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/>
<rect x="46" y="148" width="56" height="56" rx="6" fill="#DD344C"/>
<use href="#amazoniam" xlink:href="#amazoniam" x="56.08" y="158.08" width="35.84" height="35.84" fill="#FFFFFF"/>
<text x="118" y="158" font-size="13" font-weight="700" fill="#232F3E" text-anchor="start">AWS partner (account B)</text>
<text x="118" y="177" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">their own IAM role</text>
<text x="118" y="196" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">AssumeRole + our external ID</text>
<rect x="30" y="262" width="300" height="128" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/>
<rect x="46" y="298" width="56" height="56" rx="6" fill="#5F6B7A"/>
<text x="74.0" y="330.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">SFTP</text>
<text x="118" y="308" font-size="13" font-weight="700" fill="#232F3E" text-anchor="start">Non-AWS partner</text>
<text x="118" y="327" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">any standard SFTP client</text>
<text x="118" y="346" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">SSH key, no AWS account</text>
<rect x="30" y="412" width="300" height="128" rx="10" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/>
<rect x="46" y="448" width="56" height="56" rx="6" fill="#5F6B7A"/>
<text x="74.0" y="480.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">HTTP</text>
<text x="118" y="458" font-size="13" font-weight="700" fill="#232F3E" text-anchor="start">Non-AWS application</text>
<text x="118" y="477" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">asks us for an upload link,</text>
<text x="118" y="496" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">then uploads with HTTP PUT</text>
<rect x="420" y="112" width="330" height="128" rx="10" fill="#F7F8FA" stroke="#5F6B7A" stroke-width="1.5"/>
<rect x="436" y="148" width="56" height="56" rx="6" fill="#DD344C"/>
<use href="#amazoniam" xlink:href="#amazoniam" x="446.08" y="158.08" width="35.84" height="35.84" fill="#FFFFFF"/>
<text x="508" y="158" font-size="13" font-weight="700" fill="#232F3E" text-anchor="start">Our role: partner-a-upload</text>
<text x="508" y="177" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">trust: their role + external ID</text>
<text x="508" y="196" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">temporary credentials (1 h)</text>
<rect x="420" y="262" width="330" height="128" rx="10" fill="#F7F8FA" stroke="#5F6B7A" stroke-width="1.5"/>
<rect x="436" y="298" width="56" height="56" rx="6" fill="#8C4FFF"/>
<text x="464.0" y="330.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">SFTP</text>
<text x="508" y="308" font-size="13" font-weight="700" fill="#232F3E" text-anchor="start">AWS Transfer Family (SFTP)</text>
<text x="508" y="327" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">one user per partner</text>
<text x="508" y="346" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">locked to its home folder</text>
<rect x="420" y="412" width="330" height="128" rx="10" fill="#F7F8FA" stroke="#5F6B7A" stroke-width="1.5"/>
<rect x="436" y="448" width="56" height="56" rx="6" fill="#ED7100"/>
<use href="#awslambda" xlink:href="#awslambda" x="446.08" y="458.08" width="35.84" height="35.84" fill="#FFFFFF"/>
<text x="508" y="458" font-size="13" font-weight="700" fill="#232F3E" text-anchor="start">Upload-link API (Lambda)</text>
<text x="508" y="477" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">authenticates the partner</text>
<text x="508" y="496" font-size="13" font-weight="400" fill="#232F3E" text-anchor="start">returns a pre-signed URL (15 min)</text>
<line x1="332" y1="176.0" x2="418" y2="176.0" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
<text x="375.0" y="167.0" font-size="11" font-weight="400" fill="#5F6B7A" text-anchor="middle">AssumeRole</text>

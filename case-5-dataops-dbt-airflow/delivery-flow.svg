<rect width="1420" height="900" fill="#FFFFFF"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#232F3E" text-anchor="start">Case 5 · DataOps delivery flow for a dbt + Airflow team</text>
<text x="30" y="66" font-size="14" font-weight="400" fill="#5F6B7A" text-anchor="start">Nobody deploys from a laptop: a merged pull request is the only way to production.</text>
<rect x="30" y="130" width="300" height="240" rx="10" fill="#F1F3F5" stroke="#5F6B7A" stroke-width="1.5"/>
<path d="M30 140 a10 10 0 0 1 10 -10 h280 a10 10 0 0 1 10 10 v20 h-300 z" fill="#5F6B7A"/>
<text x="180.0" y="150" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1 · DEVELOP (LOCAL)</text>
<use href="#dbt" xlink:href="#dbt" x="120.0" y="174" width="48" height="48" fill="#FF694B"/>
<use href="#apacheairflow" xlink:href="#apacheairflow" x="192.0" y="174" width="48" height="48" fill="#017CEE"/>
<text x="180.0" y="252" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">own dev schema: dbt_&lt;name&gt;</text>
<text x="180.0" y="271" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">local Airflow (Docker) for DAGs</text>
<text x="180.0" y="290" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">pre-commit: dbt standards,</text>
<text x="180.0" y="309" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">SQL lint, formatting</text>
<rect x="380" y="130" width="300" height="240" rx="10" fill="#E8F4FD" stroke="#2088FF" stroke-width="1.5"/>
<path d="M380 140 a10 10 0 0 1 10 -10 h280 a10 10 0 0 1 10 10 v20 h-300 z" fill="#2088FF"/>
<text x="530.0" y="150" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2 · PULL REQUEST + CI</text>
<use href="#githubactions" xlink:href="#githubactions" x="506.0" y="174" width="48" height="48" fill="#2088FF"/>
<text x="530.0" y="252" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">lint · dbt parse · DAG import test</text>
<text x="530.0" y="271" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">dbt unit tests</text>
<text x="530.0" y="290" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">dbt build state:modified+</text>
<text x="530.0" y="309" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">in a temporary CI schema</text>
<text x="530.0" y="328" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">1 review (CODEOWNERS)</text>
<rect x="730" y="130" width="300" height="240" rx="10" fill="#F2F7EC" stroke="#7AA116" stroke-width="1.5"/>
<path d="M730 140 a10 10 0 0 1 10 -10 h280 a10 10 0 0 1 10 10 v20 h-300 z" fill="#7AA116"/>
<text x="880.0" y="150" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3 · SHARED DEV (AWS)</text>
<use href="#apacheairflow" xlink:href="#apacheairflow" x="856.0" y="174" width="48" height="48" fill="#017CEE"/>
<text x="880.0" y="252" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">auto-deploy on merge to main</text>
<text x="880.0" y="271" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">final end-to-end check</text>
<text x="880.0" y="290" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">concurrency = 1:</text>
<text x="880.0" y="309" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">one deployment at a time</text>
<rect x="1080" y="130" width="300" height="240" rx="10" fill="#F4EEFF" stroke="#8C4FFF" stroke-width="1.5"/>
<path d="M1080 140 a10 10 0 0 1 10 -10 h280 a10 10 0 0 1 10 10 v20 h-300 z" fill="#8C4FFF"/>
<text x="1230.0" y="150" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4 · PRODUCTION</text>
<use href="#apacheairflow" xlink:href="#apacheairflow" x="1170.0" y="174" width="48" height="48" fill="#017CEE"/>
<use href="#dbt" xlink:href="#dbt" x="1242.0" y="174" width="48" height="48" fill="#FF694B"/>
<text x="1230.0" y="252" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">manual dispatch, main branch only</text>
<text x="1230.0" y="271" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">Airflow + Cosmos run dbt build</text>
<text x="1230.0" y="290" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">a failing test stops downstream:</text>
<text x="1230.0" y="309" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">BI keeps yesterday&#x27;s correct data</text>
<line x1="332" y1="200" x2="378" y2="200" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
<text x="355" y="190" font-size="11" font-weight="400" fill="#5F6B7A" text-anchor="middle">push</text>
<line x1="682" y1="200" x2="728" y2="200" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
<text x="705" y="190" font-size="11" font-weight="400" fill="#5F6B7A" text-anchor="middle">merge</text>
<line x1="1032" y1="200" x2="1078" y2="200" stroke="#232F3E" stroke-width="2" marker-end="url(#arr)"/>
<text x="1055" y="190" font-size="11" font-weight="400" fill="#5F6B7A" text-anchor="middle">dispatch</text>
<path d="M530 130 C530 92, 880 92, 880 128" fill="none" stroke="#5F6B7A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrg)"/>
<text x="705" y="96" font-size="11" font-weight="400" fill="#5F6B7A" text-anchor="middle">optional: dispatch the PR branch to dev for an end-to-end test</text>
<rect x="380" y="425" width="1000" height="180" rx="10" fill="#FFF6E5" stroke="#E8A33D" stroke-width="1.5"/>
<path d="M380 435 a10 10 0 0 1 10 -10 h980 a10 10 0 0 1 10 10 v20 h-1000 z" fill="#E8A33D"/>
<text x="880.0" y="445" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5 · MONITOR AND RESPOND (production)</text>
<line x1="1300" y1="370" x2="1300" y2="423" stroke="#C77700" stroke-width="2" marker-end="url(#arro)"/>
<text x="1308" y="402" font-size="11" font-weight="400" fill="#C77700" text-anchor="start">alerts</text>
<use href="#slack" xlink:href="#slack" x="524.6666666666666" y="469" width="44" height="44" fill="#4A154B"/>
<text x="546.6666666666666" y="535" font-size="13" font-weight="700" fill="#232F3E" text-anchor="middle">Failure</text>
<text x="546.6666666666666" y="554" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">Slack #data-alerts, tags on-call</text>
<text x="546.6666666666666" y="573" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">BI told: &quot;data delayed&quot;</text>
<rect x="852.0" y="465" width="56" height="56" rx="6" fill="#C9A227"/>
<text x="880.0" y="497.0" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">TICKET</text>
<text x="880.0" y="535" font-size="13" font-weight="700" fill="#232F3E" text-anchor="middle">Warning</text>
<text x="880.0" y="554" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">ticket, no immediate action</text>
<text x="880.0" y="573" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">weekly review: fix, block or delete</text>
<rect x="1185.3333333333335" y="465" width="56" height="56" rx="6" fill="#DD344C"/>
<text x="1213.3333333333335" y="497.0" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">ON-CALL</text>
<text x="1213.3333333333335" y="535" font-size="13" font-weight="700" fill="#232F3E" text-anchor="middle">Weekly on-call rotation</text>
<text x="1213.3333333333335" y="554" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">severity levels</text>
<text x="1213.3333333333335" y="573" font-size="13" font-weight="400" fill="#232F3E" text-anchor="middle">blameless review if BI was affected</text>
<path d="M380 515.0 H180.0 V372" fill="none" stroke="#C77700" stroke-width="2" marker-end="url(#arro)"/>
<text x="190.0" y="459.0" font-size="12" font-weight="700" fill="#C77700" text-anchor="start">Improvement loop</text>
<text x="190.0" y="475.0" font-size="12" font-weight="400" fill="#C77700" text-anchor="start">every failure → the test or alert</text>
<text x="190.0" y="491.0" font-size="12" font-weight="400" fill="#C77700" text-anchor="start">that would have caught it earlier</text>
<rect x="30" y="650" width="1350" height="225" rx="8" fill="#FAFAFA" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="6 4"/>
<text x="50" y="678" font-size="13" font-weight="700" fill="#232F3E" text-anchor="start">ROLLOUT OVER THE QUARTER · each phase is useful on its own</text>
<rect x="50" y="695" width="6" height="160" rx="3" fill="#5F6B7A"/>
<text x="68" y="712" font-size="13" font-weight="700" fill="#232F3E" text-anchor="start">Phase 1 · weeks 1–3 · Safety basics</text>
<text x="68" y="738" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">• protected main, pull requests, 1 review</text>
<text x="68" y="760" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">• prod runs only from Airflow (no prod credentials on laptops)</text>
<text x="68" y="782" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">• personal dev schemas, deploy pipeline (dev auto, prod manual)</text>
<text x="68" y="804" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">• pre-commit standards as warnings</text>
<text x="68" y="826" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">• Slack failure alerts + on-call rotation</text>
<rect x="495" y="695" width="6" height="160" rx="3" fill="#2088FF"/>
<text x="513" y="712" font-size="13" font-weight="700" fill="#232F3E" text-anchor="start">Phase 2 · weeks 4–8 · Automated checks</text>
<text x="513" y="738" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">• CI: lint, dbt parse, DAG import test, unit tests</text>
<text x="513" y="760" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">• dbt build state:modified+ with --defer</text>
<text x="513" y="782" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">• generic + singular tests on every BI-facing model</text>
<text x="513" y="804" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">• shared dev: concurrency = 1</text>
<text x="513" y="826" font-size="12" font-weight="400" fill="#232F3E" text-anchor="start">• model contracts on BI-facing tables</text>
